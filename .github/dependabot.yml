# Dependabot version updates (PRODSEC-6939)
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "SECURITY-0: chore(deps)"
      prefix-development: "SECURITY-0: chore(deps-dev)"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "SECURITY-0: chore(deps)"
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
